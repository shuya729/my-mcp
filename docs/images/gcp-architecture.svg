<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">my-mcp Google Cloud アーキテクチャ</title>
<desc id="desc">利用者は公開 Cloud Run の API、MCP、Logto に、管理者は IAP 経由で Logto 管理サービスに接続する。Cloud Run の全サービスと DB 更新 Job は Cloud SQL Auth Proxy と Direct VPC egress を使い、VPC 内の Private Service Connect エンドポイント経由で Cloud SQL PostgreSQL 18 の app・logto データベースに接続する。Cloud DNS はプライベート DNS 名を解決し、Secret Manager はサービスと Job に DB 資格情報を供給する。Artifact Registry はアプリと migration のイメージを供給する。</desc>
<!-- Source: infra/{services,jobs,network,database,secrets,registry}.tf
     Official console product icons: https://cloud.google.com/icons
     https://services.google.com/fh/files/misc/google-cloud-legacy-icons.zip
     Icons are embedded unchanged; no external image dependencies. -->
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
</defs>
<style>
  text {font-family:Arial,'Noto Sans JP',sans-serif;fill:#25334a;font-size:17px;text-anchor:middle}
  .small {font-size:14px;fill:#64748b}
  .heading {font-size:18px;font-weight:600;text-anchor:start}
  .flow {fill:none;stroke:#64748b;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .support {fill:none;stroke:#94a3b8;stroke-width:1.7;stroke-dasharray:6 6;stroke-linejoin:round}
</style>
<rect width="1280" height="800" fill="white"/>
<rect x="240" y="30" width="1010" height="730" rx="20" fill="#fbfcfe" stroke="#dce3ec"/>
<text x="268" y="64" class="heading">Google Cloud</text>
<text x="1218" y="64" class="small" style="text-anchor:end">東京 · asia-northeast1</text>
<rect x="410" y="110" width="290" height="530" rx="16" fill="white" stroke="#c9d9f2"/>
<text x="435" y="145" class="heading">Cloud Run</text>
<rect x="755" y="325" width="230" height="280" rx="16" fill="#f1f6ff" stroke="#b8cff4"/>
