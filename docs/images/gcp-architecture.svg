<path class="flow" d="M 335 405 H 480" marker-end="url(#arrow)"/>
<!-- Shared database path for all services and jobs -->
<path class="flow" d="M 625 225 H 725 V 565 H 625 M 625 405 H 725"/>
<path class="flow" d="M 725 440 H 835" marker-end="url(#arrow)"/>
<text x="751" y="303" class="small">Direct VPC egress</text>
