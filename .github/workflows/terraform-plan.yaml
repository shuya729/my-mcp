name: Terraform plan

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-plan.yaml'
      - '.github/workflows/infrastructure.yaml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: 'true'
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_subnet_cidr: ${{ vars.SUBNET_CIDR }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_github_repository_id: ${{ github.repository_id }}
  TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
  TF_VAR_initial_images: ${{ vars.INITIAL_IMAGES }}
  TF_VAR_iap_admin_emails: ${{ vars.IAP_ADMIN_EMAILS || '[]' }}

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: terraform-plan@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Initialize backend
        run: terraform init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" -backend-config='prefix=my-mcp/production'
      - name: Plan
        run: terraform plan -input=false -no-color -lock-timeout=10m
